<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="64" y1="24" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- macOS / Craft Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)" stroke="#44403C" stroke-width="2.5"/>

  <!-- Subtle Dong Son Concentric Ring Halo -->
  <circle cx="64" cy="64" r="46" stroke="#78716C" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="64" cy="64" r="39" stroke="#78716C" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Left Half: Warm Gold Original Image Frame + Dong Son Sun Ray -->
  <g>
    <!-- Sun Star at top-left inside frame -->
    <polygon
      points="44,32 46.8,39.2 54,42 46.8,44.8 44,52 41.2,44.8 34,42 41.2,39.2"
      fill="url(#gold)"
    />
    <!-- Mountain / Landscape wave (Left -> Center) -->
    <path
      d="M 22 88 L 42 64 L 58 80 L 64 73 L 64 96 L 26 96 C 23.8 96 22 94.2 22 92 Z"
      fill="url(#gold)"
    />
  </g>

  <!-- Right Half: Optimized Emerald Vector Curve + Sparkle -->
  <g>
    <!-- Mountain / Landscape wave (Center -> Right, sharper/optimized) -->
    <path
      d="M 64 73 L 82 52 L 106 84 L 106 92 C 106 94.2 104.2 96 102 96 L 64 96 Z"
      fill="url(#emerald)"
    />
    <!-- Sparkle star at top-right -->
    <path
      d="M 86 28 L 88.6 35.4 L 96 38 L 88.6 40.6 L 86 48 L 83.4 40.6 L 76 38 L 83.4 35.4 Z"
      fill="#6EE7B7"
    />
  </g>

  <!-- Before / After Split Slider Vertical Line & Handle -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#FAF9F5" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="10" fill="#FAF9F5" stroke="#18181B" stroke-width="2.5"/>
  <path d="M 60 64 L 68 64 M 61.5 61.5 L 59 64 L 61.5 66.5 M 66.5 61.5 L 69 64 L 66.5 66.5" stroke="#18181B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
